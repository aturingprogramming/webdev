<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <link href="style.css" rel="stylesheet" type="text/css">
  <title>May The 4th Be With You</title>
</head>

<body>

  <div class="lds-ripple">
    <div></div>
    <div></div>
  </div>

  <div class="screen screen-1">

    <div class="title">
      <img src="maythe4th.png">
    </div>

    <div class="stars">
      <p id="prototype" class="star">.</p>
    </div>

  </div>

  <div class="screen screen-2">

    <div class="wishes">
      <h1>HAPPY STAR WARS DAY!</h1>
    </div>

    <div class="lightsabers">

      <div class="lightsaber lightsaber1">
        <div class="blade blade1"></div>
        <div class="hilt colorful-touch hilt1 colorful-touch1">
          <div class="button button1"></div>
          <div class="upper-shit1 upper-shit1-1"></div>
          <div class="upper-shit2 upper-shit2-1"></div>
          <div class="handle-part handle-part1"></div>
        </div>
      </div>

      <div class="lightsaber lightsaber2">

        <div class="blade blade2"></div>
        <div class="hilt colorful-touch hilt2 colorful-touch2">
          <div class="button button2"></div>
          <div class="upper-shit1 upper-shit1-2"></div>
          <div class="upper-shit2 upper-shit2-2"></div>
          <div class="handle-part handle-part2-1"></div>
          <div class="handle-part handle-part2-2"></div>
          <div class="handle-part handle-part2-3"></div>
          <div class="handle-part handle-part2-4"></div>
          <div class="handle-part handle-part2-5"></div>
          <div class="handle-part handle-part2-6"></div>
          <div class="handle-part handle-part2-7"></div>
          <div class="handle-part handle-part2-8"></div>
        </div>

      </div>

      <div class="lightsaber lightsaber3">

        <div class="blade blade3"></div>
        <div class="hilt colorful-touch hilt3 colorful-touch3">
          <div class="button button3-1"></div>
          <div class="button button3-2"></div>
          <div class="button button3-3"></div>
          <div class="button button3-4"></div>
          <div class="upper-shit1 upper-shit1-3"></div>
          <div class="upper-shit2 upper-shit2-3"></div>
          <div class="handle-part handle-part3-1"></div>
          <div class="handle-part handle-part3-2"></div>
          <div class="handle-part handle-part3-3"></div>
        </div>
      </div>

      <div class="lightsaber lightsaber4">

        <div class="blade blade4"></div>
        <div class="hilt colorful-touch hilt4 colorful-touch4">
          <div class="upper-shit1 upper-shit1-4"></div>
          <div class="upper-shit2 upper-shit2-4"></div>
          <div class="handle-part handle-part4"></div>
          <div class="bottom-shit bottom-shit4"></div>
        </div>
      </div>

      <div class="lightsaber lightsaber5">

        <div class="blade blade5"></div>
        <div class="hilt colorful-touch hilt5 colorful-touch5"></div>
      </div>

      <div class="lightsaber lightsaber6">
        <div class="blade blade6"></div>
        <div class="hilt colorful-touch hilt6 colorful-touch6">

          <div class="handle-part handle-part6-1"></div>
          <div class="upper-shit1 upper-shit1-6"></div>
          <div class="upper-shit2 upper-shit2-6"></div>

        </div>

      </div>

      <div class="lightsaber lightsaber7">
        <div class="blade blade7"></div>
        <div class="hilt colorful-touch hilt7 colorful-touch7">
          <div class="button button7"></div>
          <div class="circle circle7-1"></div>
          <div class="bigger-side"></div>
          <div class="upper-shit1 upper-shit1-7"></div>
          <div class="upper-shit2 upper-shit2-7"></div>
          <div class="handle-part handle-part7-1"></div>
          <div class="handle-part handle-part7-1-2"></div>
          <div class="handle-part handle-part7-2"></div>
          <div class="handle-part handle-part7-3"></div>
          <div class="handle-part handle-part7-4"></div>
          <div class="handle-part handle-part7-5"></div>
        </div>
      </div>

      <div class="lightsaber lightsaber8">
        <div class="blade blade8"></div>
        <div class="hilt colorful-touch hilt8 colorful-touch8">
          <div class="button button8"></div>
          <div class="button button8-1"></div>
          <div class="upper-shit1 upper-shit1-8"></div>
          <div class="upper-shit2 upper-shit2-8"></div>
          <div class="handle-part handle-part8">
            <div class="rhombus-1"></div>
            <div class="rhombus-2"></div>
          </div>
          <div class="triangle"></div>
        </div>
      </div>

    </div>

  </div>

  <div class="screen screen-3">

    <img id="darthvaderimg" src="darthvader2.png">

  </div>

</body>

<script src="script.js"></script>

</html>
